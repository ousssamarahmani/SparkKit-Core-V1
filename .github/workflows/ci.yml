name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Validate SparkKit workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sparkkit
          POSTGRES_USER: sparkkit
          POSTGRES_PASSWORD: sparkkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparkkit -d sparkkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sparkkit:sparkkit@localhost:5432/sparkkit
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_TRUSTED_ORIGINS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm --filter @sparkkit/db db:migrate:deploy
          pnpm --filter @sparkkit/db db:seed
          pnpm test

      - name: Build
        run: pnpm build
